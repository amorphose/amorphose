<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" role="img" aria-label="Most used languages">
<style>
.title{font:600 13px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#c9a84c;letter-spacing:.18em}
.lang{font:400 13px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#d8d4c8}
.pct{font:400 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8a8574}
.seg{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .7s ease-out forwards}
.item{opacity:0;animation:fade .6s ease-out forwards}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.seg{animation:none;transform:none}.item{animation:none;opacity:1}}
</style>
<rect x=".5" y=".5" width="439" height="149" rx="10" fill="#0d0d10" stroke="#3a3324"/>
<text x="24" y="36" class="title">MOST USED LANGUAGES</text>
<clipPath id="bar"><rect x="24" y="56" width="392" height="8" rx="4"/></clipPath>
<rect x="24" y="56" width="392" height="8" rx="4" fill="#1d1c19"/>
<g clip-path="url(#bar)"><rect x="24.0" y="56" width="173.5" height="8" fill="#f1e05a" class="seg" style="animation-delay:0.15s"/><rect x="197.5" y="56" width="121.6" height="8" fill="#e34c26" class="seg" style="animation-delay:0.27s"/><rect x="319.2" y="56" width="53.3" height="8" fill="#663399" class="seg" style="animation-delay:0.39s"/><rect x="372.4" y="56" width="43.6" height="8" fill="#3572A5" class="seg" style="animation-delay:0.51s"/></g>
<g class="item" style="animation-delay:0.5s"><circle cx="29" cy="90" r="5" fill="#f1e05a"/><text x="42" y="94" class="lang">JavaScript</text><text x="200" y="94" class="pct" text-anchor="end">44.3%</text></g><g class="item" style="animation-delay:0.6s"><circle cx="229" cy="90" r="5" fill="#e34c26"/><text x="242" y="94" class="lang">HTML</text><text x="400" y="94" class="pct" text-anchor="end">31.0%</text></g><g class="item" style="animation-delay:0.7s"><circle cx="29" cy="116" r="5" fill="#663399"/><text x="42" y="120" class="lang">CSS</text><text x="200" y="120" class="pct" text-anchor="end">13.6%</text></g><g class="item" style="animation-delay:0.8s"><circle cx="229" cy="116" r="5" fill="#3572A5"/><text x="242" y="120" class="lang">Python</text><text x="400" y="120" class="pct" text-anchor="end">11.1%</text></g>
</svg>
